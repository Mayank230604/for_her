<style>

size:clamp(1.15rem,5vw,1.65rem);text-shadow:0 0 18px #ff5f9d}.heart-center small{display:block;font:normal .7rem system-ui;letter-spacing:.09em;margin-top:7px;color:#ffd1e2}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.045)}30%{transform:scale(1)}}.btn{border:1px solid #ffb6d0;background:linear-gradient(135deg,#f86c9c,#bf477c);color:#fff;border-radius:999px;padding:15px 25px;font-weight:700;box-shadow:0 8px 30px #e4498a44;transition:transform .2s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#ffffff0b;border-color:#e7a1c477}.card{width:100%;border:1px solid #ffb1d13b;background:linear-gradient(150deg,#ffffff0e,#ffffff05);border-radius:26px;padding:28px 23px;box-shadow:0 20px 50px #0004}.envelope{font-size:5rem;display:block;filter:drop-shadow(0 0 15px #ff7fb088);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.letter{margin-top:25px;text-align:left;max-width:530px;white-space:normal;animation:reveal .8s ease both}.letter p{color:#ffe5ef}.letter .sign{text-align:right;color:#ffacd1;font-family:Georgia,serif;font-size:1.3rem}@keyframes reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}[hidden]{display:none!important}.distance{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.place{min-width:118px;padding:16px;border-radius:20px;background:#ffffff10;border:1px solid #ffffff2c}.place b{display:block;font-size:2rem}.place span{display:block;margin-top:7px}.thread{font-size:2rem;color:#ff8bb9;animation:beat 2s infinite}.pixel{font-family:monospace;background:linear-gradient(#221a44,#44213d);border:3px solid #a26a9a;border-radius:16px;padding:25px 10px;width:100%;max-width:440px;margin:12px auto 20px;box-shadow:inset 0 -24px #1a1632}.pixel .sky{font-size:2rem;letter-spacing:.2em}.pixel .players{font-size:3rem;margin:22px 0 8px}.pixel .ground{font-size:1.5rem;color:#a8d78e}.pixel .caption{font-size:.8rem;color:#f8d5e /* Original reel-inspired love-heart opening */
.hero{background:#050106;min-height:100svh;width:100vw;position:relative;left:50%;margin-left:-50vw;padding:42px 20px 55px;isolation:isolate}

@keyframes loveAppear{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.multilingual-heart .love-row{opacity:1}}
